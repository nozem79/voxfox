name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: pip install pytest ruff

      # F = pyflakes-equivalent checks (undefined names, unused imports,
      # duplicate dict keys...); E9 = syntax errors. This is the same
      # command a contributor runs locally before pushing.
      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Compile the whole tree
        run: python3 -m compileall -q src/

      # voxfox_core has no GTK/AT-SPI/network dependency, so the test suite
      # runs on a bare runner with no display and no extra system packages.
      # voxfox_ui (the GTK layer) is intentionally not covered here -- it
      # needs a live display to do anything beyond import, which is better
      # exercised by hand against a real desktop than faked in CI.
      - name: Run the test suite
        run: python3 -m pytest tests/ -v
